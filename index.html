<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Dashboard</title>

    <!-- FONT -->
   <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav>
      <div class="profile">
        <img class="logo" src="assets/AC logo.png" alt="" />
        <div class="text">
          <span>Anush K</span>
          <span>@virtueAC</span>
        </div>
      </div>

      <div class="search">
        <input type="text" id="searchInput" placeholder="Search" />
      </div>
    </nav>

    <!-- MAIN -->
    <div class="body">
      <!-- SIDEBAR -->
      <div class="leftbox">
        <ul class="menu">
          <li class="active"><a href="index.html">Home</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="growth.html">Growth</a></li>
          <li><a href="history.html">History</a></li>
        </ul>

        <div class="sidebar-bottom">
          <div class="sidebar-card">
            <h4>Today</h4>
            <p>Tasks: <span id="sideTotal">0</span></p>
            <p>Done: <span id="sideDone">0</span></p>
          </div>

          <div class="sidebar-card">
            <h4>Streak</h4>
            <p id="streak">🔥 0 Days</p>
          </div>
        </div>
      </div>

      <!-- CENTER -->
      <div class="center">
        <!-- TASK SECTION -->
        <div class="task_sec">
          <div class="task">
            <h3>Add Task</h3>

            <p id="stats">0 / 0 completed</p>

            <p id="percent">0%</p>

            <div class="progress-bar">
              <div id="progressFill"></div>
            </div>

            <input type="text" id="taskInput" placeholder="Enter your task" />
<!-- 
            <select id="categorySelect">

    <option value="Study">Study</option>
    <option value="Coding">Coding</option>
    <option value="Gym">Gym</option>
    <option value="Personal">Personal</option>

</select> -->
            <button id="addBtn">Add</button>
          </div>

          <div class="list">
            <div class="list-header">
              <h3>Task List</h3>
            </div>
            <div id="taskList"></div>
          </div>
        </div>

        <div class="category-overview">
          <div class="category-card">
            <h3>📘 Study</h3>
            <p id="studyCount">0 Tasks</p>
          </div>

          <div class="category-card">
            <h3>💻 Coding</h3>
            <p id="codingCount">0 Tasks</p>
          </div>

          <div class="category-card">
            <h3>🏋 Gym</h3>
            <p id="gymCount">0 Tasks</p>
          </div>

          <div class="category-card">
            <h3>👤 Personal</h3>
            <p id="personalCount">0 Tasks</p>
          </div>
        </div>
      </div>
    </div>

    <!-- CHART JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JS -->
    <script src="script.js"></script>
  </body>
</html>
